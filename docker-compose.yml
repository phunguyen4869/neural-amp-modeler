services:
  train:
    build: .
    volumes:
      - ./data:/data
      - ./outputs:/outputs
    # Paths in the JSON configs are relative to /data.
    # Example:
    #   docker compose run --rm train data.json model.json learning.json /outputs
    command: ["--help"]

  test:
    build: .
    working_dir: /app
    entrypoint: ["pytest"]
    command: ["tests"]

  # Web UI for A2 training: docker compose up web, then open http://<host>:8080
  # No authentication; only expose it on a trusted network.
  web:
    build: .
    image: neural-amp-modeler-train
    working_dir: /app
    entrypoint: ["python", "-m", "webui"]
    ports:
      - "8080:8080"
    volumes:
      - ./outputs:/outputs
      # Mounted so UI changes don't require rebuilding the image.
      - ./webui:/app/webui:ro
    restart: unless-stopped

  # Null-test page: docker compose up null-test, then open http://<host>:8765
  # No authentication; only expose it on a trusted network.
  null-test:
    build: .
    image: neural-amp-modeler-train
    entrypoint: ["nam-null-test"]
    command: ["--host", "0.0.0.0", "--port", "8765", "--no-open"]
    ports:
      - "8765:8765"
    volumes:
      # Mounted so UI changes don't require rebuilding the image.
      - ./nam/null_test:/usr/local/lib/python3.12/site-packages/nam/null_test:ro
    restart: unless-stopped
