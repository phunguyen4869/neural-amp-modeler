# Use on a Linux host with NVIDIA drivers + nvidia-container-toolkit:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml run --rm train ...
services:
  train:
    build:
      args:
        TORCH_INDEX_URL: ""  # default PyPI wheels, which bundle CUDA
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  web:
    build:
      args:
        TORCH_INDEX_URL: ""  # default PyPI wheels, which bundle CUDA
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
