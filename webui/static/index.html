<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAM Trainer</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #dcdcd6;
    --accent: #2f6fed; --accent-text: #fff; --ok: #1e8e3e; --bad: #c5221f; --warn: #b06000;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --card: #1e1e1c; --text: #ececea; --muted: #9a9a94; --line: #343432;
      --accent: #6c9bff; --accent-text: #101010; --ok: #5bc77a; --bad: #ff7b72; --warn: #e3b341;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 16px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input[type=text], input[type=number], input[type=file] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--text); font: inherit; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--text); }
  .check input { width: auto; }
  button { font: inherit; padding: 9px 16px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px;
          border: 1px solid var(--line); }
  .pill.running { color: var(--accent); border-color: var(--accent); }
  .pill.done { color: var(--ok); border-color: var(--ok); }
  .pill.failed, .pill.cancelled { color: var(--bad); border-color: var(--bad); }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 10px 0; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .4s; }
  .muted { color: var(--muted); font-size: 13px; }
  .msg { color: var(--warn); font-size: 14px; margin-top: 8px; }
  .msg.err { color: var(--bad); }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px;
        font: 12px/1.45 var(--mono); max-height: 280px; overflow: auto; margin: 10px 0 0;
        white-space: pre-wrap; word-break: break-all; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.num { font-variant-numeric: tabular-nums; }
  svg { width: 100%; height: 140px; display: block; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>NAM Trainer</h1>
  <p class="sub">A2 (packed WaveNet) training with the simplified trainer. One job at a time.</p>

  <section class="card">
    <h2>1. Recordings</h2>
    <div class="grid">
      <div>
        <label for="f-input">Input (the DI / source file you reamped)</label>
        <input type="file" id="f-input" accept=".wav,audio/wav">
        <div class="muted" id="u-input"></div>
      </div>
      <div>
        <label for="f-output">Output (the recording of your gear)</label>
        <input type="file" id="f-output" accept=".wav,audio/wav">
        <div class="muted" id="u-output"></div>
      </div>
    </div>
    <div class="bar" id="upbar" hidden><div></div></div>
    <div class="msg" id="upmsg"></div>
  </section>

  <section class="card">
    <h2>2. Settings</h2>
    <div class="grid">
      <div><label for="epochs">Epochs</label><input type="number" id="epochs" value="100" min="1" max="1000"></div>
      <div><label for="latency">Latency (samples, empty = auto)</label><input type="number" id="latency" placeholder="auto"></div>
      <div><label for="batch">Batch size</label><input type="number" id="batch" value="16" min="1" max="256"></div>
      <div><label for="seed">Seed</label><input type="number" id="seed" value="0"></div>
      <div><label for="name">Model name</label><input type="text" id="name" placeholder="model" maxlength="80"></div>
      <div><label for="by">Modeled by</label><input type="text" id="by" maxlength="80"></div>
    </div>
    <p class="check"><input type="checkbox" id="ignore"><label for="ignore" style="margin:0;color:inherit">Ignore data checks (at your own risk)</label></p>
    <div class="row">
      <button class="primary" id="start">Start training</button>
      <button class="danger" id="stop" hidden>Stop and export best so far</button>
    </div>
    <div class="msg err" id="startmsg"></div>
  </section>

  <section class="card" id="jobcard" hidden>
    <h2>3. Job <span class="muted" id="jobid"></span> <span class="pill" id="state"></span></h2>
    <div class="bar"><div id="bar"></div></div>
    <div class="muted" id="progress"></div>
    <div id="jobmsg" class="msg err"></div>
    <svg id="chart" viewBox="0 0 600 140" preserveAspectRatio="none" aria-label="Validation ESR by epoch"></svg>
    <table>
      <thead><tr><th>Epoch</th><th>Validation ESR</th></tr></thead>
      <tbody id="esr"></tbody>
    </table>
    <div class="row" style="margin-top:12px"><a id="dl" hidden>Download model</a></div>
    <pre id="log"></pre>
  </section>

  <section class="card" id="histcard" hidden>
    <h2>History</h2>
    <table><thead><tr><th>Job</th><th>State</th><th>Epochs</th><th>ESR</th><th></th></tr></thead>
    <tbody id="hist"></tbody></table>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let busy = false;

function fmtSize(n) { return n == null ? "no file yet" : (n / 1048576).toFixed(1) + " MB"; }

async function api(path, opts) {
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

function upload(kind, file) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", `/api/upload?kind=${kind}&name=${encodeURIComponent(file.name)}`);
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) $("upbar").firstElementChild.style.width = (100 * e.loaded / e.total) + "%";
    };
    xhr.onload = () => {
      let data = {}; try { data = JSON.parse(xhr.responseText); } catch (e) {}
      xhr.status < 300 ? resolve() : reject(new Error(data.error || xhr.statusText));
    };
    xhr.onerror = () => reject(new Error("Network error"));
    xhr.send(file);
  });
}

for (const kind of ["input", "output"]) {
  $("f-" + kind).addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    $("upmsg").textContent = ""; $("upmsg").className = "msg";
    $("upbar").hidden = false; $("upbar").firstElementChild.style.width = "0";
    busy = true;
    try { await upload(kind, file); }
    catch (err) { $("upmsg").textContent = `Upload failed: ${err.message}`; $("upmsg").className = "msg err"; }
    busy = false;
    $("upbar").hidden = true;
    refresh();
  });
}

$("start").addEventListener("click", async () => {
  $("startmsg").textContent = "";
  const num = (id) => $(id).value === "" ? null : Number($(id).value);
  try {
    await api("/api/train", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        epochs: num("epochs"), latency: num("latency"), batch_size: num("batch"),
        seed: num("seed"), name: $("name").value, modeled_by: $("by").value,
        ignore_checks: $("ignore").checked,
      }),
    });
    refresh();
  } catch (err) { $("startmsg").textContent = err.message; }
});

$("stop").addEventListener("click", async () => {
  if (confirm("Stop training now? The best checkpoint so far will still be exported.")) {
    await api("/api/cancel", { method: "POST", body: "{}" });
    refresh();
  }
});

function chart(points) {
  const svg = $("chart");
  if (points.length < 2) { svg.innerHTML = ""; return; }
  const W = 600, H = 140, pad = 8;
  const ys = points.map((p) => p[1]);
  const max = Math.max(...ys), min = Math.min(...ys, 0);
  const x = (i) => pad + (W - 2 * pad) * i / (points.length - 1);
  const y = (v) => H - pad - (H - 2 * pad) * (v - min) / ((max - min) || 1);
  const d = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ");
  svg.innerHTML = `<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
}

function fmtDuration(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  return h ? `${h} h ${m} min` : m ? `${m} min` : `${sec} s`;
}

function render(s) {
  const up = s.uploads;
  $("u-input").textContent = up.input.name ? `${up.input.name} (${fmtSize(up.input.size)})` : fmtSize(null);
  $("u-output").textContent = up.output.name ? `${up.output.name} (${fmtSize(up.output.size)})` : fmtSize(null);

  const job = s.job;
  const running = job && (job.state === "running" || job.state === "queued");
  $("start").disabled = running || busy || up.input.size == null || up.output.size == null;
  $("stop").hidden = !running;
  for (const id of ["f-input", "f-output"]) $(id).disabled = running;

  $("jobcard").hidden = !job;
  if (job) {
    $("jobid").textContent = job.id;
    $("state").textContent = job.state;
    $("state").className = "pill " + job.state;
    $("jobmsg").textContent = job.message || "";
    const total = job.params.epochs;
    const hist = Object.entries(job.esr_history || {}).map(([e, v]) => [Number(e), v]);
    let pct = job.state === "done" ? 100 : 0;
    if (running && hist.length) pct = 100 * hist.length / total;
    $("bar").style.width = Math.min(pct, 100) + "%";
    let text = "";
    if (running && job.started) {
      const elapsed = s.now - job.started;
      text = hist.length
        ? `${hist.length} of ${total} epochs done · ${fmtDuration(elapsed)} elapsed · about ${fmtDuration(elapsed / hist.length * (total - hist.length))} left`
        : `Preparing data and running the first epoch… ${fmtDuration(elapsed)} elapsed`;
    } else if (job.state === "done" && job.validation_esr != null) {
      text = `Final validation ESR ${job.validation_esr.toFixed(4)}`;
    }
    $("progress").textContent = text;
    chart(hist);
    $("esr").innerHTML = hist.map(([e, v]) => `<tr><td>${e + 1}</td><td class="num">${v.toFixed(4)}</td></tr>`).join("");
    $("dl").hidden = !job.has_model;
    $("dl").href = `/api/download?job=${job.id}`;
    const log = $("log"), atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
    log.textContent = job.log || "";
    if (atBottom) log.scrollTop = log.scrollHeight;
  }

  $("histcard").hidden = !s.history.length;
  $("hist").innerHTML = s.history.map((j) => `<tr>
    <td>${j.id}</td><td><span class="pill ${j.state}">${j.state}</span></td>
    <td class="num">${j.params.epochs ?? ""}</td>
    <td class="num">${j.validation_esr != null ? j.validation_esr.toFixed(4) : ""}</td>
    <td>${j.has_model ? `<a href="/api/download?job=${j.id}">Download</a>` : ""}</td></tr>`).join("");
}

async function refresh() {
  try { render(await api("/api/status")); } catch (err) { /* server restarting */ }
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
